<div class="share" data-share>
  <span>Share this page</span>
  <button type="button" class="btn btn-ghost btn-sm" data-share-native>Share</button>
  <button type="button" class="btn btn-ghost btn-sm" data-copy-link>Copy link</button>
  <a class="btn btn-ghost btn-sm" data-share-wa target="_blank" rel="noopener" href="https://wa.me/?text={{ page.url | absolute_url | url_encode }}">WhatsApp</a>
  <a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://x.com/intent/post?url={{ page.url | absolute_url | url_encode }}">X</a>
  <a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}">Facebook</a>
</div>
