- {title: "Know your numbers.", text: "Write down your latest blood pressure, cholesterol and blood sugar results so you can spot trends.", url: "/tools/blood-pressure/"}
- {title: "Bring a list.", text: "Take every medicine and supplement you use — or photos of the labels — to each appointment.", url: "/tools/visit-prep/"}
- {title: "Ask the teach-back question.", text: "Before you leave, repeat the plan back in your own words to make sure you understood it.", url: "/health/prepare-for-doctor-appointment/"}
- {title: "Move a little, often.", text: "Adults benefit from at least 150 minutes of moderate activity a week; short brisk walks all count.", url: "/tools/heart-rate-zones/"}
- {title: "Protect your sleep window.", text: "Keep the same wake-up time every day, even at weekends. It anchors your body clock.", url: "/health/sleep-better/"}
- {title: "Check the salt.", text: "Most dietary salt comes from packaged and restaurant food, not the salt shaker.", url: "/health/high-blood-pressure/"}
- {title: "Wash for 20 seconds.", text: "Soap, water and a full 20 seconds — including thumbs and fingertips — prevents many infections.", url: "/videos/"}
- {title: "Learn hands-only CPR.", text: "If an adult collapses: call your emergency number, then push hard and fast in the center of the chest.", url: "/videos/"}
- {title: "Know where you'd go tonight.", text: "Look up your nearest urgent care and its hours before you need it.", url: "/find-care/"}
- {title: "Keep a symptom diary.", text: "Dates, severity and triggers help your clinician far more than memory.", url: "/tools/symptom-journal/"}
- {title: "Ask about cost upfront.", text: "It is fine to ask for an estimate before tests or procedures.", url: "/health/health-insurance-terms/"}
- {title: "Spot the stroke signs.", text: "Face drooping, arm weakness, speech difficulty — time to call emergency services.", url: "/health/urgent-care-vs-er/"}
- {title: "Drink to thirst, check the color.", text: "Pale-yellow urine is a simple sign you are drinking enough.", url: "/tools/water-intake/"}
- {title: "Measure your waist.", text: "Aim to keep your waist below half your height.", url: "/tools/waist-to-height/"}
- {title: "Book your dental check.", text: "Regular checkups catch decay and gum disease early, when treatment is simpler.", url: "/health/dental-checkups/"}
- {title: "Check your skin monthly.", text: "Look for new spots or moles that change in size, shape or color.", url: "/health/skin-moles-abcde/"}
- {title: "Get a second opinion when it matters.", text: "For major surgery or a serious diagnosis, a second opinion is normal and respected.", url: "/health/second-opinion/"}
- {title: "Take breaks from screens.", text: "Every 20 minutes, look at something 20 feet away for 20 seconds.", url: "/clinics/"}
- {title: "Breathe slower.", text: "Slow breathing — in for 4, out for 6 — can calm the stress response in minutes.", url: "/health/stress-anxiety/"}
- {title: "Keep a medicine timetable.", text: "A simple printed schedule reduces missed and double doses.", url: "/tools/medication-schedule/"}
- {title: "Use the right thermometer.", text: "A digital thermometer is more reliable than touch or forehead strips.", url: "/tools/temperature/"}
- {title: "Ask which test, and why.", text: "Understanding what a test will change helps you avoid unnecessary ones.", url: "/health/lab-tests-explained/"}
- {title: "Store emergency info on your phone.", text: "Most phones let you add medical ID details that responders can see from the lock screen.", url: "/find-care/"}
- {title: "Limit alcohol.", text: "Less is better for blood pressure, sleep and liver health.", url: "/health/high-blood-pressure/"}
- {title: "Stand up and stretch.", text: "Breaking up long periods of sitting helps your back and your blood sugar.", url: "/health/back-pain/"}
- {title: "Check your vaccination record.", text: "Adults need boosters too — ask at your next checkup.", url: "/health/annual-checkup/"}
- {title: "Save your results.", text: "Ask for copies of your test results and keep them in one folder.", url: "/health/lab-tests-explained/"}
- {title: "Video visits work for many things.", text: "Refills, follow-ups and minor illnesses can often be handled by telehealth.", url: "/health/telehealth-guide/"}
- {title: "Eat more fiber.", text: "Beans, whole grains, fruit and vegetables support heart and gut health.", url: "/health/cholesterol/"}
- {title: "Wear sunscreen.", text: "Use broad-spectrum SPF 30 or higher and reapply every two hours outdoors.", url: "/health/skin-moles-abcde/"}
- {title: "Plan treatment abroad carefully.", text: "Check accreditation, the surgeon's credentials and the follow-up plan before you book.", url: "/health/medical-tourism-checklist/"}
