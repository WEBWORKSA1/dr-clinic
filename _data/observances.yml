- {month: "January", title: "Cervical Health Awareness Month", text: "Cervical screening and HPV vaccination prevent most cervical cancers. Check whether your screening is due.", url: "/health/annual-checkup/", cta: "What a checkup covers"}
- {month: "February", title: "Heart health month", text: "Heart disease is a leading cause of death worldwide. Knowing your blood pressure is the simplest first step.", url: "/tools/blood-pressure/", cta: "Check a reading"}
- {month: "March", title: "Colorectal cancer awareness and World Kidney Day", text: "Bowel screening saves lives, and simple blood and urine tests can catch kidney disease early.", url: "/health/lab-tests-explained/", cta: "Understand common tests"}
- {month: "April", title: "World Health Day (7 April)", text: "A global reminder that good care starts with knowing where to go.", url: "/find-care/", cta: "Use the care navigator"}
- {month: "May", title: "Mental health awareness and World Hypertension Day (17 May)", text: "Check in on your mind and your blood pressure — both are easy to overlook.", url: "/health/stress-anxiety/", cta: "Stress and anxiety guide"}
- {month: "June", title: "Men's health month and World Blood Donor Day (14 June)", text: "Book the checkup you have been putting off, and consider giving blood.", url: "/health/annual-checkup/", cta: "Prepare for a checkup"}
- {month: "July", title: "World Hepatitis Day (28 July)", text: "Hepatitis B and C often cause no symptoms for years. Ask whether testing is right for you.", url: "/health/lab-tests-explained/", cta: "Blood tests explained"}
- {month: "August", title: "Immunization awareness and World Breastfeeding Week", text: "Back-to-school is a good time to review the whole family's vaccinations.", url: "/specialists/", cta: "Find the right clinician"}
- {month: "September", title: "World Heart Day (29 September)", text: "Move more, eat more plants, and know your cholesterol.", url: "/health/cholesterol/", cta: "Cholesterol explained"}
- {month: "October", title: "Breast cancer awareness and World Mental Health Day (10 October)", text: "Know what is normal for your body, and ask about screening for your age and risk.", url: "/health/annual-checkup/", cta: "Checkup guide"}
- {month: "November", title: "World Diabetes Day (14 November)", text: "Many people with prediabetes do not know they have it. A simple blood test can tell you.", url: "/health/prediabetes-type-2-diabetes/", cta: "Prediabetes guide"}
- {month: "December", title: "World AIDS Day (1 December)", text: "Testing, treatment and prevention have transformed HIV care. Testing is quick and confidential.", url: "/find-care/", cta: "Find care near you"}
