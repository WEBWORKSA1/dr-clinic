# To activate: create .github/workflows/update-news.yml in GitHub (Add file -> Create new file)
# and paste this content. It refreshes _data/news.json daily from NIH, FDA and ScienceDaily.
name: Refresh health news

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest headlines
        run: python scripts/update_news.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/news.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "dr.clinic bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/news.json
          git commit -m "Refresh health news headlines"
          git push
      - name: Request a Pages build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
